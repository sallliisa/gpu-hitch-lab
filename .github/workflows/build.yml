name: Build Windows x64

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate PowerShell diagnostic launcher syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'Launch-Diagnostics.ps1').Path,
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_.Message }
            throw "Launch-Diagnostics.ps1 has parser errors"
          }

      - name: Check out official NVIDIA NVAPI SDK
        uses: actions/checkout@v4
        with:
          repository: NVIDIA/nvapi
          ref: 70d337db9186e968eab622f7e786de7e437faf3d
          path: third_party/nvapi
          persist-credentials: false

      - name: Configure (MSVC + Windows SDK)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DGPU_HITCH_BUILD_REFLEX=ON

      - name: Compile
        run: cmake --build build --config Release --parallel

      - name: Download pinned official PresentMon 2.6.0 console
        shell: pwsh
        run: |
          $uri = "https://github.com/GameTechDev/PresentMon/releases/download/v2.6.0/PresentMon-2.6.0-x64.exe"
          Invoke-WebRequest -Uri $uri -OutFile PresentMon-2.6.0-x64.exe
          $expected = "b2a706bc6ad475749e3b7e3409263aa1e6906d45bdcf993f6dbc0f660188f1af"
          $actual = (Get-FileHash PresentMon-2.6.0-x64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "PresentMon official SHA-256 mismatch" }
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/GameTechDev/PresentMon/v2.6.0/LICENSE.txt" -OutFile LICENSE-PRESENTMON.txt

      - name: Prepare separate portable versions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package-baseline -Force | Out-Null
          New-Item -ItemType Directory -Path package-reflex -Force | Out-Null
          Copy-Item build/Release/GpuHitchLab.exe package-baseline/GpuHitchLab.exe
          Copy-Item build/Release/GpuHitchLabReflex.exe package-reflex/GpuHitchLabReflex.exe
          foreach ($dir in @('package-baseline', 'package-reflex')) {
            Copy-Item README.md "$dir/README.md"
            Copy-Item Launch-Diagnostics.ps1 "$dir/Launch-Diagnostics.ps1"
            Copy-Item Run-Diagnostics.cmd "$dir/Run-Diagnostics.cmd"
            Copy-Item PresentMon-2.6.0-x64.exe "$dir/PresentMon-2.6.0-x64.exe"
            Copy-Item LICENSE-PRESENTMON.txt "$dir/LICENSE-PRESENTMON.txt"
          }
          Copy-Item third_party/nvapi/License.txt package-reflex/LICENSE-NVAPI.txt

      - name: Upload baseline executable
        uses: actions/upload-artifact@v4
        with:
          name: GpuHitchLab-Baseline-Windows-x64
          path: package-baseline/
          if-no-files-found: error
          retention-days: 14

      - name: Upload NVIDIA Reflex executable
        uses: actions/upload-artifact@v4
        with:
          name: GpuHitchLab-Reflex-Windows-x64
          path: package-reflex/
          if-no-files-found: error
          retention-days: 14
